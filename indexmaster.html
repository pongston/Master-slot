<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTP Controller</title>

<style>
body{
    background:#000;
    color:gold;
    font-family:Arial;
    text-align:center;
    padding:30px;
}

.box{
    border:1px solid gold;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
}
</style>
</head>

<body>

<h2>🎛️ RTP CONTROLLER</h2>

<div class="box">
    RTP: <span id="val">94</span>%

    <input type="range" min="90" max="96" value="94" id="rtp">
</div>

<script>
const slider = document.getElementById("rtp");
const val = document.getElementById("val");

function send(v){
    val.innerText = v;
    localStorage.setItem("rtp", v);

    const bc = new BroadcastChannel("casino");
    bc.postMessage({
        type:"rtp",
        value:parseFloat(v)
    });
}

slider.oninput = ()=>{
    send(slider.value);
};

// init
send(slider.value);
</script>

</body>
</html>
